# Render Blueprint Specification for Crezonices Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: crezonices-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --only=production
    startCommand: node server/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GCLOUD_PROJECT
        value: crezonices-2026
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
