name: Crezonices CI Pipeline

on:
  push:
    branches:
      - main
      - version-3-combined
      - experimental/version-2-human-ai
  pull_request:
    branches:
      - main
      - version-3-combined
      - experimental/version-2-human-ai

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Security Check - Verify No Committed Secrets
        run: |
          echo "Scanning for accidental secret commits..."
          LEAKED=$(git log --all --name-only --pretty=format: | grep -E '\.(secret|key|pem)$|\.env\.local$|^credentials/' || true)
          if [ -n "$LEAKED" ]; then
            echo "SECURITY ALERT: Leaked secret files found in Git history:"
            echo "$LEAKED"
            exit 1
          fi
          echo "Security scan passed: zero credentials or secret files committed."

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Run Production Frontend Build
        run: npm run build
        env:
          NODE_ENV: production
